<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.webp"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Contact Us | CleanConnect</title></head><body><main>
<section class="hero"><div class="wrap"><h1>Contact us</h1><p class="lead">Questions, feedback, or want to work with us? Send us a message.</p></div></section>
<section><div class="wrap split"><div><h2>Get in touch</h2><div id="info"></div></div>
<form id="contact-form"><div><label for="n">Your name</label><input id="n" name="name" required autocomplete="name"></div>
<div><label for="e">Your email</label><input id="e" name="email" type="email" required autocomplete="email"></div>
<div><label for="m">Message</label><textarea id="m" name="message" rows="5" required></textarea></div>
<button class="btn" type="submit">Send message</button><p id="msg" role="status"></p></form></div></section>
</main><script src="script.js"></script></body></html>
